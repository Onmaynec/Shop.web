services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: standoffshop
      POSTGRES_USER: standoffshop
      POSTGRES_PASSWORD: standoffshop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standoffshop -d standoffshop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
