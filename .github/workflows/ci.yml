name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: standoffshop
          POSTGRES_PASSWORD: standoffshop
          POSTGRES_DB: standoffshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U standoffshop -d standoffshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://standoffshop:standoffshop@localhost:5432/standoffshop?schema=public
      SESSION_SECRET: ci-only-secret-not-used-in-production-00000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Prepare test database
        run: npm run db:migrate
      - name: Detect migration drift
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Build Next.js
        run: npm run build
      - name: Integration smoke test
        run: |
          npm run start > /tmp/standoffshop-next.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/standoffshop-next.log; exit 1; fi
          node tests/smoke.mjs
          node tests/security.mjs

  sandbox:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: standoffshop
          POSTGRES_PASSWORD: standoffshop
          POSTGRES_DB: standoffshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U standoffshop -d standoffshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://standoffshop:standoffshop@localhost:5432/standoffshop?schema=public
      SESSION_SECRET: ci-only-session-secret-not-for-production-0000
      PAYMENT_SANDBOX_ENABLED: 'true'
      PAYMENT_SANDBOX_SECRET: ci-only-sandbox-signing-secret-not-for-production-0000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate
          npm run db:push
      - name: Start development server and verify sandbox
        run: |
          npm run dev > /tmp/standoffshop-dev.log 2>&1 &
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/standoffshop-dev.log; exit 1; fi
          node tests/sandbox.mjs

  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release(v0.6.0)')
    needs: [verify, sandbox]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish version tag and release after passing CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags origin
          if ! git rev-parse -q --verify refs/tags/v0.6.0 >/dev/null; then
            git tag -a v0.6.0 -m 'StandoffShop v0.6.0 — Security & Stability'
            git push origin refs/tags/v0.6.0
          fi
          if ! gh release view v0.6.0 >/dev/null 2>&1; then
            gh release create v0.6.0 --title 'StandoffShop v0.6.0 — Security & Stability' --notes-file docs/RELEASE-0.6.0.md
          fi
